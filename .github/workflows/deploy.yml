name: Deploy to Ubuntu Server

on:
  push:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: whithin-prod-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    

        
    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: 2.59.41.26
        username: root
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          cd /home
          
          # Останавливаем контейнеры в deploy папке
          echo "Stopping containers..."
          if [ -d "whithin-messenger" ]; then
            cd whithin-messenger
            docker compose down --remove-orphans -t 15 || docker-compose down --remove-orphans -t 15 || true
            cd ..
          fi
          
          # Создаем бэкап deploy папки
          echo "Creating backup..."
          if [ -d "whithin-messenger" ]; then
            rm -rf whithin-messenger-backup.old
            mv whithin-messenger-backup whithin-messenger-backup.old 2>/dev/null || true
            rsync -a --delete whithin-messenger/ whithin-messenger-backup/ || cp -a whithin-messenger/. whithin-messenger-backup/ || true
          fi
          
          # Очищаем старые образы
          echo "Cleaning old images..."
          docker system prune -f
          
    - name: Upload files to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: 2.59.41.26
        username: root
        key: ${{ secrets.SERVER_SSH_KEY }}
        source: "."
        target: "/home/whithin-messenger"
        strip_components: 0
        
    - name: Start services
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: 2.59.41.26
        username: root
        key: ${{ secrets.SERVER_SSH_KEY }}
        timeout: 30m
        script: |
          cd /home/whithin-messenger
          
          # Создаем директории для данных
          echo "Creating data directories..."
          mkdir -p /home/whithin-messenger/data/postgres
          mkdir -p /home/whithin-messenger/data/wwwroot/uploads
          chmod -R 755 /home/whithin-messenger/data
          
          # Устанавливаем права
          echo "Setting permissions..."
          chmod +x docker-compose.yml
          chmod -R 755 /home/whithin-messenger
          
          # Убираем зависшие контейнеры проекта (конфликт имён при параллельных деплоях)
          docker ps -a --filter "name=^whithin-messenger-" -q | xargs -r docker rm -f || true
          
          # Запускаем Docker контейнеры
          echo "Starting services..."
          if ! docker compose up -d --build 2>/dev/null; then
            docker-compose up -d --build || { echo "FATAL: docker compose up failed"; exit 1; }
          fi
          
          # Ждем запуска базы данных
          echo "Waiting for database to start..."
          sleep 10
          
          # Инициализируем базу данных, если нужно
          echo "Initializing database..."
          docker-compose exec -T db psql -U postgres -d whithin_db -c "SELECT 1;" 2>/dev/null || {
            echo "Database not found, creating..."
            docker-compose exec -T db createdb -U postgres whithin_db 2>/dev/null || true
          }
          
          # Ждем запуска сервисов
          echo "Waiting for services to start..."
          sleep 15
          
          # Проверяем статус всех контейнеров
          echo "Container status:"
          docker compose ps || docker-compose ps

          if ! (docker compose ps nginx 2>/dev/null || docker-compose ps nginx 2>/dev/null) | grep -qE 'Up|running'; then
            echo "FATAL: nginx is not running after deploy"
            docker compose ps -a 2>/dev/null || docker-compose ps -a
            exit 1
          fi

          if ! curl -sf --max-time 15 https://127.0.0.1/ -k >/dev/null 2>&1; then
            if ! curl -sf --max-time 15 http://127.0.0.1:80/ >/dev/null; then
              echo "FATAL: HTTP health check failed"
              exit 1
            fi
          fi

          # Проверяем логи проблемных сервисов
          echo "Backend logs:"
          docker-compose logs backend --tail=20
          
          echo "Client logs:"
          docker-compose logs client --tail=20
          
          echo "Voice server logs:"
          docker-compose logs voice-server --tail=20

          echo "Music signal logs:"
          docker-compose logs music-signal --tail=20
          
          echo "Database logs:"
          docker-compose logs db --tail=10

          echo "Music signal health:"
          curl -sf http://127.0.0.1:8082/health || echo "music-signal health check failed"

    - name: Notify Telegram on success
      if: success()
      continue-on-error: true
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
          echo "TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID not set — skip notify"
          exit 0
        fi
        COMMIT_MSG=$(echo "${{ github.event.head_commit.message }}" | head -n 1)
        TEXT=$(printf '%s\n' \
          "✅ Whithin deploy OK" \
          "" \
          "Branch: ${{ github.ref_name }}" \
          "Commit: ${GITHUB_SHA:0:7}" \
          "Message: ${COMMIT_MSG}" \
          "By: ${{ github.actor }}" \
          "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
        curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
          --data-urlencode "text=${TEXT}" \
          -d "disable_web_page_preview=true"

    - name: Notify Telegram on failure
      if: failure()
      continue-on-error: true
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
          echo "TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID not set — skip notify"
          exit 0
        fi
        COMMIT_MSG=$(echo "${{ github.event.head_commit.message }}" | head -n 1)
        TEXT=$(printf '%s\n' \
          "❌ Whithin deploy FAILED" \
          "" \
          "Branch: ${{ github.ref_name }}" \
          "Commit: ${GITHUB_SHA:0:7}" \
          "Message: ${COMMIT_MSG}" \
          "By: ${{ github.actor }}" \
          "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
        curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
          --data-urlencode "text=${TEXT}" \
          -d "disable_web_page_preview=true"

